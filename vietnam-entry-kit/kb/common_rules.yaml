# 업종 공통 규제·세무·노무 기본 사항
# 보고서 '규제 환경' 섹션에 기본 삽입됩니다. 수치는 반드시 기준일과 함께 재확인하십시오.
last_reviewed: "2026-10"

rules:
  - area: 행정체계
    text: "2025년 정부조직 개편으로 기획투자부가 재정부로 통합, 성(省)급 투자등록 창구는 재정국으로 이관. 2025.7부터 성급 행정구역 63→34개 통합, 군(郡)급 폐지 — 관할 창구·주소 표기 재확인 필요"
    status: 검증필요
  - area: 투자
    text: "외국인투자 시장접근은 Decree 31/2021/ND-CP 부록(진입 금지 25개·조건부 59개 업종)과 WTO 양허표를 함께 적용"
    status: 확인
  - area: 법인세
    text: "법인세 표준세율 20%. 신법인세법(Law 67/2025/QH15) 시행에 따른 중소기업 저율·인센티브 구조 변경 확인 필요"
    status: 검증필요
  - area: 글로벌최저한세
    text: "연결매출 7.5억 유로 이상 다국적그룹은 국내최저한세(QDMTT) 적용 (Resolution 107/2023/QH15)"
    status: 확인
  - area: 부가가치세
    text: "표준세율 10%, 일부 품목 한시 8% 인하 적용 — 적용 기간·대상 품목 재확인 필요"
    status: 검증필요
  - area: 외국계약자세
    text: "해외 법인이 베트남 고객에게 서비스·로열티를 제공하면 외국계약자세(FCT: VAT+CIT) 원천징수 대상"
    status: 확인
  - area: 이중과세
    text: "한-베 이중과세방지협정(1994) 적용 — 배당·이자·사용료 제한세율 확인"
    status: 확인
  - area: 관세·FTA
    text: "한국산 수출 시 VKFTA(2015)·AKFTA·RCEP 중 유리한 협정 선택. 원산지증명서(Form VK/AK/RCEP) 및 직접운송 요건 충족 필요"
    status: 확인
  - area: 외환
    text: "외국인 투자자는 베트남 내 직접투자자본계좌(DICA)를 통해 출자·이익 송금. 한국 측은 외국환거래법상 해외직접투자 신고(외국환은행) 선행"
    status: 확인
  - area: 노무
    text: "외국인 근로자 노동허가(Work Permit) 및 지역별 최저임금(4개 권역) 적용 — 2026년 최저임금 인상분 확인 필요"
    status: 검증필요
  - area: 노무
    text: "외국인 노동허가 신규 시행령(Decree 219/2025/ND-CP) 적용 여부 확인"
    status: 검증필요
  - area: 개인정보
    text: "개인정보보호법(Law 91/2025/QH15, 2026.1.1 시행) — 개인정보 처리 시 영향평가·국외이전 서류 작성"
    status: 검증필요
  - area: 기업
    text: "개정 기업법(2025) — 실소유자(beneficial owner) 정보 제출 의무 신설"
    status: 검증필요
  - area: 반부패
    text: "베트남 형법상 뇌물죄(민간 부문 포함) 및 한국 국제상거래뇌물방지법 동시 적용 — 중개인·컨설턴트 대가 구조 검토"
    status: 확인
