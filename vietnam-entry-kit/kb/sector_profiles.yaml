    key_rules:
      - text: "베트남 방위산업은 국방부 산하 국영기업 중심 구조이며, 외국인의 직접 생산·판매 진입은 원칙적으로 제한 — 기술이전·합작·현지 지정업체 경유 형태가 일반적"
