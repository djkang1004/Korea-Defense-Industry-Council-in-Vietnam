      - text: "국방안보산업 및 산업동원법(2024 제정, 2025.7 시행)에 따른 민간·외국 참여 범위 확인 필요"
        status: 검증필요
      - text: "한국산 방산물자는 방위사업법상 방위사업청 수출허가 대상, 이중용도 품목은 대외무역법상 전략물자 판정(무역안보관리원) 선행"
        status: 확인
      - text: "군용 물자의 베트남 수입은 국방부 지정 기관을 통한 통제 수입 구조 — 민간 수입 경로 확인 필요"
