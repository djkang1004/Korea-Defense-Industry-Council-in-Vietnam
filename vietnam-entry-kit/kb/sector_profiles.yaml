    marketing_channels:
      - "베트남 국방 전시회(Vietnam International Defence Expo) 등 정부 주관 전시"
      - 주베트남 대한민국대사관 국방무관부·KOTRA 협업
      - G2G 협의체·방산 협의회 네트워크
