# 조사 모듈 정의
# - when: 인테이크 deliverables 또는 sensitivity 플래그 중 하나라도 해당되면 모듈 생성
# - questions.code: 여러 LLM 답변을 같은 코드로 정렬해 교차검증하는 키 (절대 중복 금지)
# - 치환자: {company} {products} {sector} {cities} {customers} {objective} {hs_codes}
last_reviewed: "2026-10"

modules:
  - id: MKT
    title: 시장 규모·수요 구조
    when: [market_research]
    role: 베트남 산업·시장 분석 전문 리서처
    questions:
      - {code: MKT-01, q: "베트남 {sector} 시장 규모(금액·물량)와 최근 5년 성장률, 향후 3~5년 전망치"}
      - {code: MKT-02, q: "{products} 관련 세부 시장(세그먼트)별 규모와 비중"}
      - {code: MKT-03, q: "{hs_codes} 기준 베트남 수입액 추이(최근 5년)와 상위 수입국 점유율, 한국산 비중"}
      - {code: MKT-04, q: "주요 수요처·고객군 구조 ({customers}) 및 구매 의사결정 방식"}
      - {code: MKT-05, q: "{cities} 지역별 수요 차이와 우선 공략 지역 근거"}
      - {code: MKT-06, q: "수요 견인 요인(정책·인구·소득·산업 투자)과 저해 요인"}

  - id: CMP
    title: 경쟁 구도
    when: [market_research, marketing_research]
    role: 경쟁 분석 전문 컨설턴트
    questions:
      - {code: CMP-01, q: "베트남 내 {products} 주요 경쟁사 상위 5~10개(현지·한국·중국·일본·기타)와 추정 점유율"}
      - {code: CMP-02, q: "경쟁사별 가격대·유통 채널·포지셔닝"}
      - {code: CMP-03, q: "한국 기업의 진출 사례(성공·실패)와 시사점"}
      - {code: CMP-04, q: "진입 장벽(인증·유통 장악·가격) 및 {company}의 차별화 가능 영역"}

  - id: REG
    title: 규제·시장접근
    when: [market_research, entity_setup, trade]
    role: 베트남 투자·통상 규제 전문 법률 리서처 (법률 자문이 아닌 조사 목적)
    questions:
      - {code: REG-01, q: "{products} 사업의 VSIC 업종코드와 Decree 31/2021/ND-CP 외국인 시장접근 제한 해당 여부, WTO 양허상 외국인 지분 상한"}
      - {code: REG-02, q: "제품 판매 전 필요한 인허가·등록·공표·인증(관할 기관, 소요 기간, 명의자 요건)"}
      - {code: REG-03, q: "{hs_codes}의 수입 시 전문검사·적합성 인증(QCVN/CR) 및 수입 허가 대상 여부"}
      - {code: REG-04, q: "라벨링·광고·표시 규제 핵심 사항"}
      - {code: REG-05, q: "2025~2026년 시행·예정된 관련 법령 개정 사항과 영향"}

  - id: TRD
    title: 수출입·관세·물류
    when: [trade]
    role: 국제통상·관세 전문가
    questions:
      - {code: TRD-01, q: "{hs_codes}의 베트남 MFN 관세율과 VKFTA·AKFTA·RCEP 협정세율 비교(2026년 기준), 부가세·특별소비세"}
      - {code: TRD-02, q: "원산지 결정기준(품목별 원산지 규정)과 원산지증명 발급 절차"}
      - {code: TRD-03, q: "주요 통관 서류·소요 시간·주요 항구/공항(하이퐁, 깟라이, 노이바이, 떤선녓) 실무 이슈"}
      - {code: TRD-04, q: "한국→베트남 해상·항공 운임 수준과 리드타임, 현지 창고·3PL 옵션"}
      - {code: TRD-05, q: "베트남→제3국 수출 시(해당 시) 원산지·수출 인센티브 요건"}

  - id: CHN
    title: 유통채널·파트너
    when: [market_research, marketing_research]
    role: 베트남 유통·B2B 세일즈 전문가
    questions:
      - {code: CHN-01, q: "{products}의 일반적인 유통 구조(수입사→도매→소매/직판/입찰)와 단계별 마진율"}
      - {code: CHN-02, q: "유력 수입사·유통사·대리점 후보 유형과 선정 기준"}
      - {code: CHN-03, q: "독점 대리점 계약 시 일반 조건(기간·최소구매·해지)과 분쟁 사례"}
      - {code: CHN-04, q: "공략 우선 채널 3개와 각 채널 진입 비용·소요 기간"}

  - id: MKG
    title: 마케팅·소비자·브랜드
    when: [marketing_research]
    role: 베트남 디지털·B2B 마케팅 전략가
    questions:
      - {code: MKG-01, q: "목표 고객({customers})의 인구통계·구매 행태·정보 탐색 채널"}
      - {code: MKG-02, q: "베트남 내 한국 브랜드·한국산 제품 인식(신뢰도, 가격 수용도) 최신 조사 결과"}
      - {code: MKG-03, q: "효과적인 마케팅 채널(Facebook, Zalo, TikTok, YouTube, 이커머스, 전시회, KOL 등)별 비용 수준과 성과 벤치마크"}
      - {code: MKG-04, q: "가격 전략 — 경쟁사 대비 적정 가격대와 프로모션 관행"}
      - {code: MKG-05, q: "광고·인플루언서 마케팅 관련 규제와 금지 표현"}
      - {code: MKG-06, q: "{company}에 적합한 진입 초기 6개월 마케팅 KPI와 예산 배분 예시"}

  - id: ENT
    title: 법인·지사·사무소 설립 실무
    when: [entity_setup]
    role: 베트남 외국인투자 설립 실무 전문가 (법률 자문이 아닌 절차 조사 목적)
    questions:
      - {code: ENT-01, q: "{company}의 목적({objective})에 맞는 진출형태(대표사무소·지점·100% 외투법인·합작법인·BCC) 비교와 각 형태의 허용 활동 범위"}
      - {code: ENT-02, q: "선택 가능한 형태별 설립 절차 단계·관할 기관(2025년 조직개편 반영)·법정/실무 소요 기간"}
      - {code: ENT-03, q: "형태별 필요 서류 목록(본국 서류 공증·영사확인 포함)"}
      - {code: ENT-04, q: "자본금 요건·적정 수준 판단 기준·출자 기한·DICA 계좌 개설 절차"}
      - {code: ENT-05, q: "{cities} 지역별 사무실 임대료 수준과 공단·경제구역 입주 시 인센티브"}
      - {code: ENT-06, q: "설립 후 유지 의무(회계감사, 세무신고, 이전가격, 노동허가, 보고) 및 연간 유지비 범위"}
      - {code: ENT-07, q: "설립·운영 단계 주요 세제(법인세, 부가세, FCT) 및 투자 인센티브 적용 가능성"}

  - id: RSK
    title: 리스크·이해관계자
    when: [market_research, entity_setup]
    role: 정치·규제·평판 리스크 분석가
    questions:
      - {code: RSK-01, q: "{sector} 분야의 베트남 정치·정책 리스크(정책 변동, 지정학, 국영기업 경쟁)"}
      - {code: RSK-02, q: "주요 이해관계자 지도(정부 부처, 협회, 국영기업, 경쟁사, 한국 측 지원기관)와 영향력"}
      - {code: RSK-03, q: "부패·컴플라이언스 리스크 사례와 예방 관행"}
      - {code: RSK-04, q: "투자금·매출 회수(송금, 환율, 대금 지급 관행) 리스크"}

  - id: DEF
    title: 방산·이중용도 특화
    when: [defense_or_military, dual_use_or_strategic]
    role: 방산 수출통제·국방 조달 전문 리서처 (법률 자문이 아닌 조사 목적)
    questions:
      - {code: DEF-01, q: "베트남 국방 조달 구조(국방부·국방산업총국·지정 수입업체)와 외국 기업 참여 경로"}
      - {code: DEF-02, q: "국방안보산업 및 산업동원법(2024) 주요 내용과 외국·민간 기업 참여 허용 범위"}
      - {code: DEF-03, q: "{products}의 한국 측 수출통제(방위사업청 수출허가, 전략물자 판정) 해당 가능성과 절차·기간"}
      - {code: DEF-04, q: "한-베 국방·방산 협력 현황(MOU, 공동위원회, 최근 계약 사례)"}
      - {code: DEF-05, q: "제3국 제재(미국 등)·재수출 통제가 거래에 미칠 영향"}
      - {code: DEF-06, q: "현지 에이전트·중개인 활용 관행과 반부패 리스크 관리 방안"}
